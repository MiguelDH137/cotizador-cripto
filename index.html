<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriptoZador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1>CRYPTOZADOR</h1>

    <div id="container-body">

        <!-- Seccion izquierda -->
        <div id="container-img">
            <img src="./assets/cat-crypto.webp" alt="crypto imagen" width="250px">
        </div>
    
        <!-- Seccion Derecha -->
        <div id="container-cripto">
            
            <!-- Formulario de datos -->
            <form id="crypto-form">

                <!-- Menu de monedas -->
                <div class="form-input-container">
                    <label for="select-coin">Selecciona Tu Moneda</label>
                    <select class="form-input" id="select-coin">
                        <option value="" selected disabled>Selecciona una moneda</option>
                        <option value="USD">Dolar Estadounidense</option>
                        <option value="EUR">Euro</option>
                        <option value="ARS">Pesos Argentinos</option>
                        <!-- <option value="VES">Bolivares</option> -->
                    </select>
                </div>
                
                <!-- menu de cryptos -->
                <div class="form-input-container">
                    <label for="select-crypto">Selecciona Tu Cryptomoneda</label>
                    <select class="form-input" id="select-crypto">
                        <option value="" selected disabled>Selecciona una crypto</option>
                        <option value="BTC">Bitcoin</option>
                        <option value="ETH">Ethereum</option>
                        <option value="BNB">Binance Coin</option>
                    </select>
                </div>
                
                <!-- Input de montos -->
                <div class="form-input-container">
                    <label for="amount">Ingresa Un Monto</label>
                    <input type="number" class="form-input" id="amount" placeholder="Monto">
                </div>
                
                <!-- Boton para subir el formulario -->
                <div class="form-btn-container">
                    <button id="form-btn" type="submit">COTIZAR</button>
                </div>
            </form>
    
            <!-- Seccion de informacion devuelta por el formulario -->
            <div id="crypto-info">
                <h3>Ingrese Datos Para Cotizar</h3>
                <!-- Injectado desde JS -->
            </div>
    
        </div>

    </div>


    <script src="./script.js"></script>
</body>
</html>
