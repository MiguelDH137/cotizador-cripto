<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriptoZador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1>CRYPTOZADOR</h1>

    <div id="container-body">

        <!-- Seccion izquierda -->
        <div id="container-img">
            <img src="./assets/crypto-img-placeholder.svg" alt="crypto imagen" width="250px">
        </div>
    
        <!-- Seccion Derecha -->
        <div id="container-cripto">
            
            <!-- Formulario de datos -->
            <form id="cripto-form">

                <!-- Menu de monedas -->
                <div class="form-input-container">
                    <label for="coin">Selecciona Tu Moneda</label>
                    <select class="form-input" id="select-coin">
                        <option value="" selected disabled>Selecciona una moneda</option>
                        <option value="USD">Dolar Estadounidense</option>
                        <option value="EUR">Euro</option>
                        <option value="ARS">Pesos Argentinos</option>
                        <option value="VES">Bolivares</option>
                    </select>
                </div>
                
                <!-- menu de cryptos -->
                <div class="form-input-container">
                    <label for="crypto">Selecciona Tu Cryptomoneda</label>
                    <select class="form-input" id="select-crypto">
                        <option value="" selected disabled>Selecciona una crypto</option>
                        <option value="BTC">Bitcoin</option>
                        <option value="ETH">Ethereum</option>
                        <option value="AXS">AXS</option>
                        <option value="BNB">Binance Coin</option>
                    </select>
                </div>
                
                <!-- Input de montos -->
                <div class="form-input-container">
                    <label for="crypto">Ingresa Un Monto</label>
                    <input type="number" class="form-input" id="amount" placeholder="Monto">
                </div>
                
                <!-- Boton para subir el formulario -->
                <div class="form-btn-container">
                    <button id="form-btn" type="submit">COTIZAR</button>
                </div>
            </form>
    
            <!-- Seccion de informacion devuelta por el formulario -->
            <div id="cripto-info">
                <p class="info-p">El precio es:<span class="price"></span></p>
                <p class="info-p">El precio mas alto es: <span class="price"></span></p>
                <p class="info-p">El precio mas bajo es: <span class="price"></span></p>
                <p class="info-p">Variacion de 24h: <span class="price"></span></p>
                <p class="info-p">Puede comprar: <span class="price"></span></p>
            </div>
    
        </div>

    </div>


</body>
<script src="/script.js"></script>
</html>
